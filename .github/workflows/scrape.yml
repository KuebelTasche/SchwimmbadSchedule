# Holt jeden Morgen neue Kurse aus dem Buchungsportal und committet die Datenbank.
# Streamlit Community Cloud übernimmt den neuen Stand danach automatisch.
# Gibt es Neuigkeiten zu beobachteten Kursen (config.yaml → beobachten), wird ein Issue angelegt.
# Manuell starten: GitHub → Actions → "Kurse aktualisieren" → "Run workflow".
name: Kurse aktualisieren

on:
  schedule:
    - cron: "13 4 * * *"   # täglich 04:13 UTC = 06:13 Sommerzeit / 05:13 Winterzeit
  workflow_dispatch:

permissions:
  contents: write           # Datenbank zurück ins Repo schreiben
  issues: write             # Benachrichtigung zu beobachteten Kursen

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren (nur was der Scraper braucht)
        run: pip install requests beautifulsoup4 PyYAML holidays tzdata

      - name: Kurse holen
        run: python scrape.py --meldungen meldungen.md

      - name: Datenbank committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nettebad.sqlite
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Kurse aktualisiert ($(TZ=Europe/Berlin date +'%d.%m.%Y %H:%M'))"
            git pull --rebase
            git push
          fi

      - name: Benachrichtigung zu beobachteten Kursen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s meldungen.md ]; then
            gh issue create \
              --title "🏊 Neuigkeiten zu beobachteten Kursen ($(TZ=Europe/Berlin date +'%d.%m.%Y'))" \
              --body-file meldungen.md
          else
            echo "Keine Neuigkeiten zu beobachteten Kursen."
          fi
